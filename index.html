<h1>WhisperOfSol</h1>
<p>WhisperOfSol 是一個跑在 Solana 上的端對端加密 whispers 應用。訊息在送出前就完成加密,
只有接收者用自己的錢包簽章後才能解密。收款全部走鏈上原生交易,不需要傳統帳戶。</p>
<h2>功能</h2>
<ul>
<li>端對端加密 whispers,金鑰不離開裝置</li>
<li>Solana 鏈上收發與非同步收款</li>
<li>Solana Mobile Wallet Adapter 簽章,私鑰不進應用程式</li>
</ul>
